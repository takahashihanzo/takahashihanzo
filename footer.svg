<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1092 110" width="1092" height="110" role="img" aria-label="connection closed">
<defs><style><![CDATA[text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes gl{0%,90%,100%{transform:translate(0,0);opacity:0}91%{transform:translate(-4px,1px);opacity:.8}93%{transform:translate(4px,-1px);opacity:.8}95%{opacity:0}}
.l{opacity:0;animation:fadeIn .3s ease forwards}
.c{animation:blink 1s step-end infinite}
.r{animation:gl 4s linear 2s infinite}
]]></style>
<filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect x="1" y="1" width="1090" height="108" rx="14" fill="#030603" stroke="#14501f"/>
<text class="l" x="24" y="38" font-size="14" style="animation-delay:.2s"><tspan fill="#00ff41" font-weight="bold">root@hanzo</tspan><tspan fill="#8b949e">:~# </tspan><tspan fill="#e6edf3">logout</tspan></text>
<text class="l" x="24" y="64" font-size="14" fill="#8b949e" style="animation-delay:.9s">[ connection closed by foreign host ]</text>
<g class="l" style="animation-delay:1.6s">
<text class="r" x="24" y="92" font-size="16" font-weight="bold" fill="#ff2b2b">see you in the shadows, takahashihanzo_</text>
<text x="24" y="92" font-size="16" font-weight="bold" fill="#00ff41" filter="url(#g)">see you in the shadows, takahashihanzo<tspan class="c">_</tspan></text></g>
</svg>
