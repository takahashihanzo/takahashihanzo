<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1092 124" width="1092" height="124" role="img" aria-label="Recent GitHub activity log">
<defs><style><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes scan{0%{transform:translateY(-40px)}100%{transform:translateY(124px)}}
.ln{opacity:0;animation:fadeIn .25s ease forwards}
.cur{animation:blink 1s step-end infinite}
.scan{animation:scan 5s linear infinite}
]]></style>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"><animate attributeName="stop-color" values="#00ff41;#00c853;#00ff41" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#00c853;#00ff41;#00c853" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="sc" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#00ff41" stop-opacity="0"/><stop offset="100%" stop-color="#00ff41" stop-opacity=".12"/></linearGradient>
<pattern id="crt" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#00ff41" opacity=".05"/></pattern>
<filter id="gl"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="cp"><rect x="1" y="1" width="1090" height="122" rx="14"/></clipPath>
</defs>
<rect x="1" y="1" width="1090" height="122" rx="14" fill="#030603" stroke="url(#tg)" stroke-width="1.5"/>
<rect x="1" y="1" width="1090" height="30" rx="14" fill="#0d1f0f"/><rect x="1" y="16" width="1090" height="15" fill="#0d1f0f"/>
<circle cx="22" cy="16" r="5" fill="#ff5f57"/><circle cx="40" cy="16" r="5" fill="#febc2e"/><circle cx="58" cy="16" r="5" fill="#28c840"/>
<text x="546.0" y="20" text-anchor="middle" font-size="12" fill="#8b949e">activity.log</text>
<text x="22" y="58" font-size="14"><tspan fill="#00ff41" font-weight="bold">root@hanzo</tspan><tspan fill="#8b949e">:~# </tspan><tspan fill="#e6edf3">tail -f /var/log/github/activity.log</tspan></text>
<text class="ln" x="22" y="84" font-size="14" style="animation-delay:0.50s"><tspan fill="#8b949e">[--]</tspan><tspan fill="#8b949e" font-weight="bold"> IDLE </tspan><tspan fill="#cdd3dd">no public activity yet — go commit something 💀</tspan></text>
<rect class="cur" x="22" y="100" width="9" height="15" fill="#00ff41"/>
<g clip-path="url(#cp)"><rect class="scan" x="0" y="0" width="1092" height="40" fill="url(#sc)"/><rect width="1092" height="124" fill="url(#crt)"/></g>
</svg>
