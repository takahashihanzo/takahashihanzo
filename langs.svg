<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 282" width="420" height="282" role="img" aria-label="Top languages">
<defs><style><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes shineX{0%{transform:translateX(-140px)}60%,100%{transform:translateX(460px)}}
.row{opacity:0;animation:fadeUp .5s ease forwards}
.sh{animation:shineX 4s ease-in-out 2.2s infinite}
]]></style>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"><animate attributeName="stop-color" values="#00ff41;#00c853;#00ff41" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#00c853;#00ff41;#00c853" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="shg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".08"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="cardc"><rect x="1" y="1" width="418" height="280" rx="14"/></clipPath>
<clipPath id="stackc"><rect x="20" y="58" width="0" height="11" rx="5.5"><animate attributeName="width" from="0" to="380" dur="1.4s" begin=".4s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/></rect></clipPath>
</defs>
<rect x="1" y="1" width="418" height="280" rx="14" fill="#050a05" stroke="url(#tg)" stroke-width="1.5"/>
<text x="20" y="34" font-size="16" font-weight="bold" fill="url(#tg)">📊 root@hanzo:~# langs</text>
<g clip-path="url(#stackc)"><rect x="20.0" y="58" width="226.0" height="11" fill="#f1e05a"/><rect x="246.0" y="58" width="125.6" height="11" fill="#aa6746"/><rect x="371.7" y="58" width="14.7" height="11" fill="#dea584"/><rect x="386.3" y="58" width="13.7" height="11" fill="#00f36b"/></g>

  <g class="row" style="animation-delay:0.90s">
    <circle cx="26" cy="91" r="5" fill="#f1e05a"/>
    <text x="40" y="96" font-size="13" fill="#e6edf3" font-weight="bold">JavaScript</text>
    <text x="396" y="96" text-anchor="end" font-size="13" fill="#f1e05a" font-weight="bold">59.5%</text>
    <rect x="40" y="104" width="268" height="9" rx="4.5" fill="#0f2412"/>
    <rect x="40" y="104" width="159.4" height="9" rx="4.5" fill="#f1e05a">
      <animate attributeName="width" from="0" to="159.4" dur="1.1s" begin="1.05s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>
  <g class="row" style="animation-delay:1.25s">
    <circle cx="26" cy="133" r="5" fill="#aa6746"/>
    <text x="40" y="138" font-size="13" fill="#e6edf3" font-weight="bold">Solidity</text>
    <text x="396" y="138" text-anchor="end" font-size="13" fill="#aa6746" font-weight="bold">33.1%</text>
    <rect x="40" y="146" width="268" height="9" rx="4.5" fill="#0f2412"/>
    <rect x="40" y="146" width="88.6" height="9" rx="4.5" fill="#aa6746">
      <animate attributeName="width" from="0" to="88.6" dur="1.1s" begin="1.40s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>
  <g class="row" style="animation-delay:1.60s">
    <circle cx="26" cy="175" r="5" fill="#dea584"/>
    <text x="40" y="180" font-size="13" fill="#e6edf3" font-weight="bold">Rust</text>
    <text x="396" y="180" text-anchor="end" font-size="13" fill="#dea584" font-weight="bold">3.9%</text>
    <rect x="40" y="188" width="268" height="9" rx="4.5" fill="#0f2412"/>
    <rect x="40" y="188" width="10.4" height="9" rx="4.5" fill="#dea584">
      <animate attributeName="width" from="0" to="10.4" dur="1.1s" begin="1.75s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>
  <g class="row" style="animation-delay:1.95s">
    <circle cx="26" cy="217" r="5" fill="#00f36b"/>
    <text x="40" y="222" font-size="13" fill="#e6edf3" font-weight="bold">C++</text>
    <text x="396" y="222" text-anchor="end" font-size="13" fill="#00f36b" font-weight="bold">3.6%</text>
    <rect x="40" y="230" width="268" height="9" rx="4.5" fill="#0f2412"/>
    <rect x="40" y="230" width="9.6" height="9" rx="4.5" fill="#00f36b">
      <animate attributeName="width" from="0" to="9.6" dur="1.1s" begin="2.10s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>
<g clip-path="url(#cardc)"><rect class="sh" x="0" y="0" width="100" height="282" fill="url(#shg)" transform="skewX(-15)"/></g>
</svg>
