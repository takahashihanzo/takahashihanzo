    <path transform="translate(94.3,0) scale(0.02406,-0.02406)" d="M12 158Q12 165 14 183H179Q177 152 197.5 133.5Q218 115 256 115Q288 115 309.0 127.0Q330 139 330 161Q330 182 307.5 194.5Q285 207 233 225Q179 243 142.5 260.5Q106 278 80.0 311.0Q54 344 54 394Q54 443 83.0 482.5Q112 522 164.5 544.0Q217 566 286 566Q355 566 406.0 543.5Q457 521 485.0 481.0Q513 441 513 391L512 376H357Q359 406 339.0 424.0Q319 442 282 442Q253 442 234.5 430.0Q216 418 216 397Q216 375 240.5 360.5Q265 346 317 328Q371 310 406.5 292.5Q442 275 467.5 243.5Q493 212 493 165Q493 111 460.5 72.0Q428 33 371.5 12.5Q315 -8 243 -8Q177 -8 124.5 13.0Q72 34 42.0 71.5Q12 109 12 158Z"/>
    <path transform="translate(107.7,0) scale(0.02406,-0.02406)" d="M630 386Q630 358 624 326L566 0H396L450 303Q453 320 453 333Q453 375 429.5 398.0Q406 421 364 421Q314 421 280.0 390.0Q246 359 236 303V305L182 0H11L142 740H313L268 484Q301 521 349.0 542.5Q397 564 453 564Q535 564 582.5 517.0Q630 470 630 386Z"/>
