      <g transform="translate(103.0,516)" fill="url(#nameg2)" filter="url(#glow2)">
    <path transform="translate(0.0,0) scale(0.02406,-0.02406)" d="M640 702 617 567H430L330 0H159L259 567H73L97 702Z"/>
    <path transform="translate(14.2,0) scale(0.02406,-0.02406)" d="M323 566Q382 566 422.0 542.0Q462 518 480 479L494 558H665L566 0H395L410 79Q378 40 329.0 16.0Q280 -8 221 -8Q162 -8 116.5 19.0Q71 46 46.0 95.5Q21 145 21 212Q21 244 27 280Q42 366 86.0 431.0Q130 496 192.0 531.0Q254 566 323 566ZM448 312Q448 361 419.5 389.0Q391 417 347 417Q296 417 254.0 380.5Q212 344 201 280Q198 262 198 247Q198 198 226.5 169.5Q255 141 298 141Q349 141 391.0 178.0Q433 215 445 279Q448 297 448 312Z"/>
