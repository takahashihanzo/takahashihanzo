      <text x="98" y="345" font-size="9" fill="#8b949e" letter-spacing="1.5">ACCESS LEVEL: ROOT</text>
      <text x="322" y="345" text-anchor="end" font-size="9" fill="#00ff41" letter-spacing="1.5">UID 0</text>

      <!-- avatar -->
      <circle cx="210" cy="412" r="59" fill="none" stroke="url(#cardborder)" stroke-width="2.5"/>
      <defs><radialGradient id="avbg"><stop offset="0%" stop-color="#0b2a10"/><stop offset="100%" stop-color="#050a05"/></radialGradient></defs>
      <circle cx="210" cy="412" r="54" fill="url(#avbg)"/>
      <circle cx="210" cy="412" r="44" fill="none" stroke="url(#nameg2)" stroke-width="1" stroke-dasharray="3 5" opacity=".7"/>
      <g transform="translate(175.6,428)" fill="url(#nameg2)" filter="url(#glow2)"><path transform="translate(0.0,0) scale(0.05200,-0.05200)" d="M640 702 617 567H430L330 0H159L259 567H73L97 702Z"/><path transform="translate(30.7,0) scale(0.05200,-0.05200)" d="M743 702 619 0H448L499 291H233L182 0H11L135 702H306L257 426H523L572 702Z"/></g>
      <path d="M210 366 L213 375 L222 378 L213 381 L210 390 L207 381 L198 378 L207 375 Z" fill="#00ff41" opacity=".9" transform="translate(0,-4) scale(1)"/>

