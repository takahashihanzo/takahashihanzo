    <rect x="750" y="124" width="0" height="5" rx="2.5" fill="#00ff41">
      <animate attributeName="width" from="0" to="0.0" dur="1s" begin="1.32s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>
  <g class="cell" style="animation-delay:1.20s">
    <rect x="912" y="12" width="168" height="144" rx="14" fill="#050a05" stroke="#00e676" stroke-opacity=".55" stroke-width="1.3"/>
    <text x="996.0" y="52" text-anchor="middle" font-size="30">🧠</text>
    <text class="rk" x="1064" y="40" text-anchor="end" font-size="30" font-weight="bold" fill="#00e676" style="animation-delay:1.60s">S</text>
    <text x="996.0" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6edf3">Polyglot</text>
    <text x="996.0" y="112" text-anchor="middle" font-size="11" fill="#9aa4b2">Languages 10</text>
    <rect x="930" y="124" width="132" height="5" rx="2.5" fill="#0f2412"/>
    <rect x="930" y="124" width="0" height="5" rx="2.5" fill="#00e676">
      <animate attributeName="width" from="0" to="105.6" dur="1s" begin="1.50s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>
<g clip-path="url(#tc)"><rect class="sh2" x="0" y="0" width="140" height="168" fill="url(#shg2)"/></g>
</svg>
