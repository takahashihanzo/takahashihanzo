    <rect x="570" y="124" width="132" height="5" rx="2.5" fill="#0f2412"/>
    <rect x="570" y="124" width="0" height="5" rx="2.5" fill="#4ade80">
      <animate attributeName="width" from="0" to="52.8" dur="1s" begin="1.14s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>
  <g class="cell" style="animation-delay:1.02s">
    <rect x="732" y="12" width="168" height="144" rx="14" fill="#050a05" stroke="#00ff41" stroke-opacity=".55" stroke-width="1.3"/>
    <text x="816.0" y="52" text-anchor="middle" font-size="30">🔀</text>
    <text class="rk" x="884" y="40" text-anchor="end" font-size="30" font-weight="bold" fill="#00ff41" style="animation-delay:1.42s">-</text>
    <text x="816.0" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6edf3">Collaborator</text>
    <text x="816.0" y="112" text-anchor="middle" font-size="11" fill="#9aa4b2">PRs 0</text>
