      <animate attributeName="width" from="0" to="26.4" dur="1s" begin="0.96s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>
  <g class="cell" style="animation-delay:0.84s">
    <rect x="552" y="12" width="168" height="144" rx="14" fill="#050a05" stroke="#4ade80" stroke-opacity=".55" stroke-width="1.3"/>
    <text x="636.0" y="52" text-anchor="middle" font-size="30">📦</text>
    <text class="rk" x="704" y="40" text-anchor="end" font-size="30" font-weight="bold" fill="#4ade80" style="animation-delay:1.24s">B</text>
