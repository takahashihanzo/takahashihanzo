<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1092 168" width="1092" height="168" role="img" aria-label="GitHub trophies">
<defs><style><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes popCell{0%{opacity:0;transform:translateY(16px) scale(.85)}70%{opacity:1;transform:translateY(-3px) scale(1.03)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes rankGlow{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes shineX2{0%{transform:translateX(-200px) skewX(-15deg)}60%,100%{transform:translateX(1172px) skewX(-15deg)}}
.cell{opacity:0;animation:popCell .55s cubic-bezier(.2,.8,.3,1.2) forwards;transform-box:fill-box;transform-origin:center}
.rk{animation:rankGlow 2.2s ease-in-out infinite}
.sh2{animation:shineX2 5s ease-in-out 2s infinite}
]]></style>
<linearGradient id="shg2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="tc"><rect x="0" y="0" width="1092" height="168" rx="14"/></clipPath>
</defs>

  <g class="cell" style="animation-delay:0.30s">
    <rect x="12" y="12" width="168" height="144" rx="14" fill="#050a05" stroke="#fde047" stroke-opacity=".55" stroke-width="1.3"/>
    <text x="96.0" y="52" text-anchor="middle" font-size="30">⭐</text>
    <text class="rk" x="164" y="40" text-anchor="end" font-size="30" font-weight="bold" fill="#fde047" style="animation-delay:0.70s">C</text>
    <text x="96.0" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6edf3">Stargazer</text>
    <text x="96.0" y="112" text-anchor="middle" font-size="11" fill="#9aa4b2">Stars 1</text>
    <rect x="30" y="124" width="132" height="5" rx="2.5" fill="#0f2412"/>
    <rect x="30" y="124" width="0" height="5" rx="2.5" fill="#fde047">
      <animate attributeName="width" from="0" to="26.4" dur="1s" begin="0.60s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>
  <g class="cell" style="animation-delay:0.48s">
    <rect x="192" y="12" width="168" height="144" rx="14" fill="#050a05" stroke="#00c853" stroke-opacity=".55" stroke-width="1.3"/>
    <text x="276.0" y="52" text-anchor="middle" font-size="30">👥</text>
    <text class="rk" x="344" y="40" text-anchor="end" font-size="30" font-weight="bold" fill="#00c853" style="animation-delay:0.88s">-</text>
    <text x="276.0" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6edf3">Rising Star</text>
    <text x="276.0" y="112" text-anchor="middle" font-size="11" fill="#9aa4b2">Followers 0</text>
    <rect x="210" y="124" width="132" height="5" rx="2.5" fill="#0f2412"/>
    <rect x="210" y="124" width="0" height="5" rx="2.5" fill="#00c853">
      <animate attributeName="width" from="0" to="0.0" dur="1s" begin="0.78s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>
  <g class="cell" style="animation-delay:0.66s">
    <rect x="372" y="12" width="168" height="144" rx="14" fill="#050a05" stroke="#7dd3fc" stroke-opacity=".55" stroke-width="1.3"/>
    <text x="456.0" y="52" text-anchor="middle" font-size="30">💻</text>
