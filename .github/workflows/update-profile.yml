name: Update profile stats 📊

on:
  schedule:
    - cron: "30 0 * * *"   # daily, after the snake
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/update_profile.py"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Refresh stats, languages, trophies and project list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 scripts/update_profile.py

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stats.svg langs.svg trophies.svg neofetch.svg activity.svg README.md
            git commit -m "chore: refresh profile stats [skip ci]"
            git push
          else
            echo "No changes."
          fi
